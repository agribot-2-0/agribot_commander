image: docker:git

pipelines:
  default:
     - step:
         name: "Check cpplint"
         script:
           - apk add --update bash coreutils tar python3 py3-pip
           - pip3 install cpplint
           - cpplint --filter=-whitespace/braces,-legal/copyright --recursive src/*
     - step:
         name: "Check pylint"
         script:
           - apk add --update bash coreutils tar python3 py3-pip
           - pip3 install pylint
           - cpplint scripts/*
     - step:
         name: "ROS Build"
         services:
           - docker
         script:
           - apk add --update bash coreutils tar
           - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci -b master
           - git clone https://github.com/panpawelchmiel/agribot_map.git
           - git clone https://github.com/panpawelchmiel/agribot_msgs.git
           - git clone https://github.com/panpawelchmiel/agribot_common.git
           - .industrial_ci/bitbucket.sh  ROS_DISTRO="melodic" UPSTREAM_WORKSPACE="agribot_msgs agribot_common agribot_map"

definitions:
  services:
    docker:
      memory: 2048
